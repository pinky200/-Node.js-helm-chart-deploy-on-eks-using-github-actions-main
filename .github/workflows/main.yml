name: Deploy to EKS with Helm
on:
  push:
    branches: [ "main" ]
    paths:
      - 'node-app/**'  # Only trigger when Helm chart changes
      - 'src/**'       # Or your application code directory
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials (OIDC)
      uses: aws-actions/configure-aws-credentials@v2
      with:
        role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
        aws-region: us-east-1
        role-session-name: github-${{ github.run_id }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ steps.login-ecr.outputs.registry }}/yoecr:${{ github.sha }}
          ${{ steps.login-ecr.outputs.registry }}/yoecr:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Install kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.27'  # Match your EKS version

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'

    - name: Configure kubeconfig
      run: |
        aws eks update-kubeconfig \
          --name yocluster \
          --region us-east-1

    - name: Deploy Helm Chart
      run: |
        # Use upgrade --install for idempotent deployment
        helm upgrade --install nodeapp ./node-app \
          --namespace default \
          --create-namespace \
          --set image.repository=${{ steps.login-ecr.outputs.registry }}/yoecr \
          --set image.tag=${{ github.sha }} \
          --atomic \
          --wait \
          --timeout 5m

    - name: Verify deployment
      run: |
        kubectl get pods -n default
        helm test nodeapp -n default
